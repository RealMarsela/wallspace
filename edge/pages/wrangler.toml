# Cloudflare Pages project "wallspace" (https://wallspace.pages.dev): a thin front for the product Worker, which deploys with
# workers_dev = false. Deploy with: npx wrangler pages deploy edge/pages/public --project-name wallspace
name = "wallspace"
pages_build_output_dir = "public"
compatibility_date = "2026-10-01"

[[services]]
binding = "APP"
service = "wallspace"
